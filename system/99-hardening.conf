# Hide kernel memory addresses from normal programs
kernel.kptr_restrict = 2
# Block file tricks in shared folders like /tmp
fs.protected_fifos = 2
fs.protected_regular = 2
# Harden the kernel's BPF compiler
net.core.bpf_jit_harden = 2
# Don't auto-load old terminal line drivers
dev.tty.ldisc_autoload = 0
# Log suspicious network packets, and never act as a router
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.all.send_redirects = 0
fs.suid_dumpable = 0
fs.suid_dumpable = 0
