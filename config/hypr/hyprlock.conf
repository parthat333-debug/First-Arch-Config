# Background must stay the FIRST "path =" in this file (the wallpaper engine updates it)
background {
    monitor =
    path = /home/parth/Pictures/Wallpapers/1114300-bleach-rebirth-of-souls-bande-annonce-et-date-de-sortie.jpg
    blur_passes = 3
    brightness = 0.55
}

general {
    hide_cursor = true
}

animations {
    enabled = false
}

# ---------- LEFT: weather ----------
shape {
    monitor =
    size = 380, 160
    color = rgba(20, 20, 30, 0.55)
    rounding = 18
    position = 80, 280
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/lockinfo.sh temp
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.95)
    position = 110, 300
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/lockinfo.sh cond
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.7)
    position = 110, 240
    halign = left
    valign = center
}

