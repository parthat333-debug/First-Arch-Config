# ---------- CENTRE: avatar, name, password ----------
image {
    monitor =
    path = /home/parth/.face
    size = 190
    rounding = -1
    border_size = 3
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.95)
    position = 0, 35
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(20, 20, 30, 0.6)
    font_color = rgb(230, 230, 230)
    placeholder_text = Password…
    fail_text = Wrong password
    rounding = 14
    position = 0, -45
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] echo "$LAYOUT     $(~/.config/hypr/lockinfo.sh battery)"
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.7)
    position = 0, -115
    halign = center
    valign = center
}

